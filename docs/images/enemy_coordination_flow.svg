<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="450" y="35" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">敌人攻击冷却与多敌人防群殴协调流程 (Combat Cooldown &amp; Coordination)</text>

  <!-- 1. 攻击结束 -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="150" height="55" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="105" y="105" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">攻击蒙太奇结束</text>
    <text x="105" y="123" font-size="10" fill="#79c0ff" text-anchor="middle">退出 EES_Attacking</text>
  </g>

  <!-- 2. 开启冷却 -->
  <g filter="url(#shadow)">
    <rect x="220" y="80" width="160" height="55" rx="8" fill="#21262d" stroke="#d29922" stroke-width="2"/>
    <text x="300" y="105" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">开启招式独立冷却</text>
    <text x="300" y="123" font-size="10" fill="#e3b341" text-anchor="middle">进入拉扯 CooldownSpacing</text>
  </g>

  <!-- 3. 同目标友军判定 -->
  <g filter="url(#shadow)">
    <rect x="420" y="80" width="200" height="55" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
    <text x="520" y="103" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">IsAllyAttackingNearby()</text>
    <text x="520" y="122" font-size="9.5" fill="#d2a8ff" text-anchor="middle">检查同目标友军是否正在出招</text>
  </g>

  <!-- 4. 协调等待 -->
  <g filter="url(#shadow)">
    <rect x="420" y="185" width="200" height="55" rx="8" fill="#21262d" stroke="#da3633" stroke-width="2"/>
    <text x="520" y="210" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🤝 CoordinatedWaiting</text>
    <text x="520" y="228" font-size="10" fill="#ff7b72" text-anchor="middle">让出攻击权，保持防守站位</text>
  </g>

  <!-- 5. 准许攻击 -->
  <g filter="url(#shadow)">
    <rect x="680" y="80" width="180" height="55" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="770" y="105" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">⚔️ 获得出手权</text>
    <text x="770" y="123" font-size="10" fill="#7ee787" text-anchor="middle">朝向满足后提交攻击</text>
  </g>

  <!-- 连线 -->
  <path d="M 180 107 L 220 107" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 380 107 L 420 107" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="400" y="98" font-size="10" fill="#8b949e" text-anchor="middle">冷却完毕</text>

  <path d="M 520 135 L 520 185" fill="none" stroke="#f85149" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="560" y="160" font-size="10" fill="#ff7b72" text-anchor="middle">友军正在攻击</text>

  <path d="M 620 107 L 680 107" fill="none" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="650" y="98" font-size="10" fill="#7ee787" text-anchor="middle">无友军占用</text>
</svg>
