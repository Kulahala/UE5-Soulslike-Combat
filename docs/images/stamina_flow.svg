<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f85149"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="450" y="35" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">体力消耗、透支与恢复时序 (Stamina &amp; Exhaustion Pipeline)</text>

  <!-- 1. 消耗触发 -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="200" height="60" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="130" y="96" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">动作消耗体力</text>
    <text x="130" y="115" font-size="10" fill="#79c0ff" text-anchor="middle">攻击 / 翻滚 / 举盾 / 冲刺</text>
  </g>

  <!-- 2. 组件扣除 -->
  <g filter="url(#shadow)">
    <rect x="280" y="70" width="180" height="60" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
    <text x="370" y="96" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">UAttributeComponent</text>
    <text x="370" y="115" font-size="10" fill="#8b949e" text-anchor="middle">UseStamina() 扣除并Clamp</text>
  </g>

  <!-- 3. 判定分支 -->
  <!-- 正常继续 -->
  <g filter="url(#shadow)">
    <rect x="520" y="70" width="160" height="60" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="600" y="96" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">体力充足 (&gt; 0)</text>
    <text x="600" y="115" font-size="10" fill="#7ee787" text-anchor="middle">继续当前动作 / 连招</text>
  </g>

  <!-- 4. 透支耗尽 -->
  <g filter="url(#shadow)">
    <rect x="280" y="180" width="180" height="60" rx="8" fill="#21262d" stroke="#f85149" stroke-width="2"/>
    <text x="370" y="206" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">体力透支 (&lt;= 0)</text>
    <text x="370" y="225" font-size="10" fill="#ff7b72" text-anchor="middle">派发 OnExhausted 委托</text>
  </g>

  <!-- 5. 延迟进入疲惫 -->
  <g filter="url(#shadow)">
    <rect x="520" y="180" width="160" height="60" rx="8" fill="#21262d" stroke="#d29922" stroke-width="2"/>
    <text x="600" y="206" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EAS_Exhausted</text>
    <text x="600" y="225" font-size="10" fill="#e3b341" text-anchor="middle">启动 3s 恢复计时器</text>
  </g>

  <!-- 6. 恢复常态 -->
  <g filter="url(#shadow)">
    <rect x="730" y="180" width="140" height="60" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="800" y="206" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">恢复常态</text>
    <text x="800" y="225" font-size="10" fill="#79c0ff" text-anchor="middle">EAS_UnOccupied</text>
  </g>

  <!-- 底部自然回体 -->
  <rect x="30" y="260" width="840" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="450" y="285" font-size="11" fill="#8b949e" text-anchor="middle">🌿 离开战斗/停止耗体 2s 后自动以 20/s 速率恢复耐力（举盾期间以 0.7 倍率恢复）</text>

  <!-- 连线 -->
  <path d="M 230 100 L 280 100" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 460 100 L 520 100" fill="none" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M 370 130 L 370 180" fill="none" stroke="#f85149" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <path d="M 460 210 L 520 210" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 680 210 L 730 210" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="705" y="200" font-size="10" fill="#8b949e" text-anchor="middle">超时</text>
</svg>
