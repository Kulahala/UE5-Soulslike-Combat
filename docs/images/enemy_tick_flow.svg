<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="450" y="35" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">敌人 Tick 帧更新与行为派发流 (Enemy Tick &amp; Dispatch Flow)</text>

  <!-- 1. Tick 入口 -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="130" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="95" y="100" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">AEnemy::Tick()</text>
  </g>

  <!-- 2. 状态守卫 -->
  <g filter="url(#shadow)">
    <rect x="200" y="70" width="180" height="50" rx="8" fill="#21262d" stroke="#d29922" stroke-width="2"/>
    <text x="290" y="93" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">状态守卫 (State Guard)</text>
    <text x="290" y="109" font-size="9.5" fill="#e3b341" text-anchor="middle">Dead / Stunned / Attack 等直接Return</text>
  </g>

  <!-- 3. CheckCombatTarget -->
  <g filter="url(#shadow)">
    <rect x="420" y="70" width="200" height="50" rx="8" fill="#21262d" stroke="#bc8cff" stroke-width="2"/>
    <text x="520" y="93" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CheckCombatTarget()</text>
    <text x="520" y="109" font-size="9.5" fill="#d2a8ff" text-anchor="middle">按距离/有效性切换 Combating/Chase</text>
  </g>

  <!-- 4. 分发到各状态 Tick -->
  <g filter="url(#shadow)">
    <rect x="660" y="70" width="200" height="50" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="760" y="93" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">State Tick 业务分发</text>
    <text x="760" y="109" font-size="9.5" fill="#7ee787" text-anchor="middle">OnPatrolling / OnChasing 等</text>
  </g>

  <!-- 5. 战斗子状态细分 (重点) -->
  <g filter="url(#shadow)">
    <rect x="330" y="170" width="530" height="150" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="350" y="195" font-size="12" font-weight="bold" fill="#58a6ff">OnCombating 内部局部 HFSM 驱动链：</text>

    <!-- 子步骤 1 -->
    <rect x="350" y="215" width="150" height="45" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="425" y="235" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">TickCombatFacing</text>
    <text x="425" y="250" font-size="9" fill="#79c0ff" text-anchor="middle">平滑面向目标与速度缓动</text>

    <!-- 子步骤 2 -->
    <rect x="520" y="215" width="160" height="45" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="600" y="235" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">EvaluateCombatSubState</text>
    <text x="600" y="250" font-size="9" fill="#79c0ff" text-anchor="middle">评估拉扯 / 压迫 / 协调等待</text>

    <!-- 子步骤 3 -->
    <rect x="700" y="215" width="140" height="45" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="770" y="235" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Commit Attack</text>
    <text x="770" y="250" font-size="9" fill="#79c0ff" text-anchor="middle">满足条件播放攻击蒙太奇</text>
  </g>

  <!-- 连线 -->
  <path d="M 160 95 L 200 95" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 380 95 L 420 95" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 620 95 L 660 95" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M 760 120 L 760 170" fill="none" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
