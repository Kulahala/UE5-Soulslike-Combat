<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8b949e"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="400" y="35" font-size="16" font-weight="bold" fill="#58a6ff" text-anchor="middle">武器装备状态流转 (EWeaponState Flow)</text>

  <!-- 1. 未装备 -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="180" height="60" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
    <text x="140" y="136" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">未装备 (徒手)</text>
    <text x="140" y="155" font-size="10" fill="#8b949e" text-anchor="middle">EWS_Unequipped</text>
  </g>

  <!-- 2. 单手剑盾 -->
  <g filter="url(#shadow)">
    <rect x="310" y="70" width="200" height="60" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="410" y="96" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">单手装备 (剑盾)</text>
    <text x="410" y="115" font-size="10" fill="#7ee787" text-anchor="middle">EWS_OneHandEquipped</text>
  </g>

  <!-- 3. 双手持弓 -->
  <g filter="url(#shadow)">
    <rect x="570" y="110" width="180" height="60" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="660" y="136" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">双手持弓 (弓箭)</text>
    <text x="660" y="155" font-size="10" fill="#79c0ff" text-anchor="middle">EWS_TwoHandEquipped</text>
  </g>

  <!-- 连线 -->
  <!-- 徒手 <-> 剑盾 -->
  <path d="M 230 120 Q 270 90 310 90" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="260" y="95" font-size="10" fill="#c9d1d9" text-anchor="middle">装备单手剑</text>

  <path d="M 310 115 Q 270 135 230 135" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="270" y="145" font-size="10" fill="#8b949e" text-anchor="middle">卸下武器</text>

  <!-- 徒手 <-> 弓箭 -->
  <path d="M 140 170 Q 400 240 660 170" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="400" y="235" font-size="10" fill="#c9d1d9" text-anchor="middle">直接装备弓箭 / 卸下弓箭</text>

  <!-- 剑盾 <-> 弓箭 切换 -->
  <path d="M 510 90 Q 550 90 570 120" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="545" y="95" font-size="10" fill="#c9d1d9" text-anchor="middle">切换持弓</text>

  <path d="M 570 145 Q 530 120 510 115" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="545" y="145" font-size="10" fill="#c9d1d9" text-anchor="middle">切回剑盾</text>
</svg>
